name: Discovery on Hostinger

on:
  push:
    branches:
      - main

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Discovery
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "Current Working Directory (PWD):"
            pwd
            echo "Listing files in home directory:"
            ls -F
            echo "Searching for default.php to find public_html:"
            find . -name "default.php"
            echo "Listing contents of potential public_html locations:"
            ls -la public_html 2>/dev/null || echo "public_html not found at root"
            ls -la domains/carloscanofernandez.com/public_html 2>/dev/null || echo "Alternative path not found"
