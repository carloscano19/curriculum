name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Export
        run: npm run build

      - name: Cleanup Hostinger and Debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            echo "Current files in public_html:"
            ls -la public_html
            echo "Deleting default and existing files..."
            rm -f public_html/default.php
            rm -f public_html/index.php
            rm -f public_html/php.ini
            rm -f public_html/index.html
            # Clean up potential parking page files
            find public_html -maxdepth 1 -name "hostinger*" -delete

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "out/*,out/**/*"
          target: "public_html"
          strip_components: 1
          overwrite: true
