name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Export
        run: npm run build

      - name: Cleanup Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            # Try both possible paths
            for path in "public_html" "domains/carloscanofernandez.com/public_html"; do
              if [ -d "$path" ]; then
                echo "Cleaning up $path..."
                rm -f "$path/default.php" "$path/Default.php"
                rm -f "$path/index.php" "$path/Index.php"
                rm -f "$path/php.ini"
                rm -f "$path/index.html"
              fi
            done
            echo "Cleanup done."

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "out/*,out/**/*"
          target: "domains/carloscanofernandez.com/public_html"
          strip_components: 1
          overwrite: true
